<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DayPlanner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- 공통 레이아웃 CSS -->
    <link th:href="@{/css/common.css}" rel="stylesheet">

    <!-- 이 페이지 전용 스타일 -->
    <style>
        .stats-card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            background-color: white;
        }

        .stats-card .card-header {
            background-color: #f7f7f5;
            color: #333;
            border-bottom: 1px solid #e5e5e5;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 사이드바 프래그먼트 (현재 메뉴: statistics) -->
    <div th:replace="~{fragments/layout :: sidebar('statistics')}"></div>

    <main class="main">

        <!-- 헤더 프래그먼트 (제목: 통계) -->
        <div th:replace="~{fragments/layout :: header('통계')}"></div>

        <section class="content">

            <h1 class="page-title">할일 통계</h1>

            <div class="stats-card">
                <div class="card-header">
                    <h3 class="mb-0 h6">전체 현황</h3>
                </div>
                <div class="card-body">

                    <!-- 통계 테이블 -->
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered table-hover text-center align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>전체 Todo</th>
                                    <th>시작전</th>
                                    <th>진행중</th>
                                    <th>완료</th>
                                    <th>완료율</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="fw-bold" th:text="${stats.total_count}">0</td>
                                    <td><span class="badge bg-secondary" th:text="${stats.todo_count}">0</span></td>
                                    <td><span class="badge bg-warning text-dark" th:text="${stats.doing_count}">0</span></td>
                                    <td><span class="badge bg-success" th:text="${stats.done_count}">0</span></td>
                                    <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(stats.completion_rate, 1, 1)} + '%'">0.0%</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Highcharts가 그려질 영역 (기존 data-* 속성 그대로 유지) -->
                    <div id="statsChart" class="w-100" style="height: 400px;"
                         th:data-todo="${stats.todo_count}"
                         th:data-doing="${stats.doing_count}"
                         th:data-done="${stats.done_count}">
                    </div>

                </div>
            </div>

        </section>

    </main>

</div>

<!-- Bootstrap 5 JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Highcharts CDN -->
<script src="https://code.highcharts.com/highcharts.js"></script>
<!-- 분리된 JS 파일 (기존 그대로) -->
<script th:src="@{/js/stats.js}"></script>

</body>
</html>
