<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 일정 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <main class="mx-auto p-4 p-md-5" style="max-width:560px;">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <h1 class="h4 fw-bold mb-0" th:text="${todo.title}">제목</h1>
            <!-- todo.staus == 'Y' -> status(TODO/DOING/DONE) 3단계 배지로 교체 -->
            <span th:if="${todo.status == 'DONE'}" class="badge bg-success-subtle text-success-emphasis">완료</span>
            <span th:if="${todo.status == 'DOING'}" class="badge bg-warning-subtle text-warning-emphasis">진행중</span>
            <span th:if="${todo.status == 'TODO'}" class="badge bg-secondary-subtle text-secondary-emphasis">시작전</span>
        </div>

        <div class="mb-4">
            <div class="small fw-semibold text-muted mb-1">날짜</div>
            <div th:text="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}">2026-06-15</div>
        </div>
		<div class="mb-4">
		    <div class="small fw-semibold text-muted mb-1">상세 내용</div>
		    <p th:text="${todo.content}">내용</p>
		</div>

		<!-- 첨부파일 표시 -->
		<div class="mb-4" th:if="${todo.files != null and !todo.files.isEmpty()}">
		    <div class="small fw-semibold text-muted mb-2">첨부파일</div>
		    <div th:each="file : ${todo.files}" class="mb-2">
		        <!-- 이미지 확장자면 미리보기, 아니면 파일명만 -->
		        <div th:if="${#strings.toLowerCase(file.file_name).endsWith('.jpg')
		                     or #strings.toLowerCase(file.file_name).endsWith('.jpeg')
		                     or #strings.toLowerCase(file.file_name).endsWith('.png')
		                     or #strings.toLowerCase(file.file_name).endsWith('.gif')}">
		            <img th:src="@{'/files/' + ${file.file_url}}" style="max-width:100%; border-radius:6px;" />
		            <div class="small text-muted mt-1" th:text="${file.file_name}"></div>
		        </div>
		        <div th:unless="${#strings.toLowerCase(file.file_name).endsWith('.jpg')
		                          or #strings.toLowerCase(file.file_name).endsWith('.jpeg')
		                          or #strings.toLowerCase(file.file_name).endsWith('.png')
		                          or #strings.toLowerCase(file.file_name).endsWith('.gif')}">
		            📄 <a th:href="@{'/files/' + ${file.file_url}}" th:text="${file.file_name}" target="_blank"></a>
		        </div>
		    </div>
		</div>

        <div class="d-flex gap-2 pt-2">
            <a th:href="@{/todo/modify/{id}(id=${todo.todo_id}, page=${page}, keyword=${keyword})}" class="btn btn-dark btn-sm">수정</a>
            <form id="deleteForm" th:action="@{/todo/delete/{id}(id=${todo.todo_id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
            </form>
            <a th:href="@{/todo/list(page=${page}, keyword=${keyword})}" class="btn btn-light btn-sm">목록으로</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 삭제 버튼 누르면 jQuery로 확인창 띄우고, 취소하면 제출 막기
        $('#deleteForm').on('submit', function (e) {
            if (!confirm('삭제하시겠습니까?')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
