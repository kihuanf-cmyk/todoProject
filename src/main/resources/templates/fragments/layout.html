<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 사이드바 프래그먼트: activeMenu 파라미터로 각 페이지에서 현재 메뉴 표시 -->
<aside class="sidebar" th:fragment="sidebar(activeMenu)">

    <div class="logo">DayPlanner</div>

    <nav class="sidebar-menu">
        <a th:href="@{/}"
           th:classappend="${activeMenu == 'home'} ? 'active'">🏠 홈</a>

        <a th:href="@{/calendar}"
           th:classappend="${activeMenu == 'calendar'} ? 'active'">📅 캘린더</a>

        <a th:href="@{/todo/list}"
           th:classappend="${activeMenu == 'todo'} ? 'active'">☑ 일정</a>

        <a th:href="@{/kanban}"
           th:classappend="${activeMenu == 'kanban'} ? 'active'">▦ 칸반 보드</a>

        <a th:href="@{/statistics}"
           th:classappend="${activeMenu == 'statistics'} ? 'active'">📊 통계</a>
    </nav>

</aside>

<!-- 헤더 프래그먼트: title 파라미터로 각 페이지 제목만 다르게 -->
<header class="header" th:fragment="header(title)">
    <div class="header-title" th:text="${title}">홈</div>

    <div>
        <span th:text="${#authentication.name} + '님'">기환님</span>
        <a th:href="@{/logout}" class="btn btn-sm btn-outline-secondary ms-3">로그아웃</a>
    </div>
</header>

</body>
</html>
