<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>

<div class="app-container">

    <!-- 사이드바 프래그먼트 (현재 메뉴: todo) -->
    <div th:replace="~{fragments/layout :: sidebar('todo')}"></div>

    <main class="main">

        <!-- 헤더 프래그먼트 (제목: 일정 등록) -->
        <div th:replace="~{fragments/layout :: header('일정 등록')}"></div>

        <section class="content">
            <div class="mx-auto" style="max-width:720px;">

                <h1 class="page-title">일정 등록</h1>

                <form th:action="@{/todo/save}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">날짜</label>
                        <input type="date" name="schedule_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" name="title" class="form-control" required maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">내용</label>
                        <textarea name="content" class="form-control" rows="4" maxlength="500" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">첨부파일 (1개)</label>
                        <input type="file" name="file" id="fileInput" class="form-control" accept="image/*">
                        <div id="fileName" class="form-text"></div>
                    </div>
                    <div id="previewSection" class="p-3 bg-light rounded border mb-3" style="display:none;">
                        <img id="imagePreview" class="img-fluid rounded border mb-2" style="max-height:300px;display:block;">
                        <button type="button" id="clearFileButton" class="btn btn-outline-danger btn-sm">첨부파일 삭제</button>
                    </div>
                    <a th:href="@{/todo/list}" class="btn btn-outline-secondary btn-sm">취소</a>
                    <button type="submit" class="btn btn-dark btn-sm">등록</button>
                </form>

            </div>
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/register.js}"></script>

</body>
</html>
