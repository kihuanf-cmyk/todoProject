<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>할일 통계</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">할일 통계</h3>
                </div>
                <div class="card-body">
                    
                    <!-- 통계 테이블 -->
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered table-hover text-center align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>전체 Todo</th>
                                    <th>시작전</th>
                                    <th>진행중</th>
                                    <th>완료</th>
                                    <th>완료율</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="fw-bold" th:text="${stats.total_count}">0</td>
                                    <td><span class="badge bg-secondary" th:text="${stats.todo_count}">0</span></td>
                                    <td><span class="badge bg-warning text-dark" th:text="${stats.doing_count}">0</span></td>
                                    <td><span class="badge bg-success" th:text="${stats.done_count}">0</span></td>
                                    <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(stats.completion_rate, 1, 1)} + '%'">0.0%</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Highcharts가 그려질 영역 (data-* 속성으로 Thymeleaf 데이터 주입) -->
                    <div id="statsChart" class="w-100" style="height: 400px;"
                         th:data-todo="${stats.todo_count}"
                         th:data-doing="${stats.doing_count}"
                         th:data-done="${stats.done_count}">
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- jQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap 5 JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Highcharts CDN -->
<script src="https://code.highcharts.com/highcharts.js"></script>
<!-- 분리된 JS 파일 -->
<script th:src="@{/js/stats.js}"></script>
</body>
</html>
