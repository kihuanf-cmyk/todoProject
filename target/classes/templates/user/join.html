<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
<main class="mx-auto p-4 p-md-5" style="max-width:480px;">
  <h1 class="h3 fw-bold mb-4">회원가입</h1>
  <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
  <form id="joinForm" th:action="@{/user/join}" method="post">
    <div class="mb-3">
      <label class="form-label small fw-semibold text-muted">아이디</label>
      <input type="text" name="user_id" class="form-control" pattern="[a-zA-Z0-9@]{4,20}" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold text-muted">비밀번호</label>
      <input type="password" name="pwd" class="form-control" pattern="[a-zA-Z0-9@]{4,20}" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold text-muted">이름</label>
      <input type="text" name="user_name" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-dark btn-sm">가입 완료</button>
    <a th:href="@{/user/login}" class="btn btn-light btn-sm">취소</a>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/join.js}"></script>
</body>
</html>
