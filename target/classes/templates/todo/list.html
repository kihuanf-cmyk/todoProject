<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <!-- 공통 레이아웃 CSS -->
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>

<div class="app-container">

    <!-- 사이드바 프래그먼트 (현재 메뉴: todo) -->
    <div th:replace="~{fragments/layout :: sidebar('todo')}"></div>

    <main class="main">

        <!-- 헤더 프래그먼트 (제목: 일정 목록) -->
        <div th:replace="~{fragments/layout :: header('일정 목록')}"></div>

        <section class="content">
            <div class="mx-auto" style="max-width:720px;">

                <!-- 제목 & 새로 만들기 버튼 -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="page-title mb-0">📋 내 일정</h1>
                    <a th:href="@{/todo/register}" class="btn btn-dark btn-sm">+ 새로 만들기</a>
                </div>

                <!-- 검색 폼 -->
                <form th:action="@{/todo/list}" method="get" class="mb-4">
                    <div class="input-group input-group-sm">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="제목으로 검색"
                               th:value="${keyword}">
                        <button type="submit" class="btn btn-outline-secondary">🔍 검색</button>
                        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                           th:href="@{/todo/list}"
                           class="btn btn-outline-dark">✕ 전체보기</a>
                    </div>
                </form>

                <!-- 검색 결과 안내 문구 -->
                <p th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                   class="small text-muted mb-2">
                    '<span th:text="${keyword}"></span>' 검색 결과
                    <span th:text="'(' + ${#lists.size(todoList)} + '건)'"></span>
                </p>

                <!-- 목록이 비어있을 때 -->
                <div th:if="${#lists.isEmpty(todoList)}" class="text-center text-muted py-5">
                    <span th:if="${keyword != null and !#strings.isEmpty(keyword)}">
                        검색 결과가 없습니다.
                    </span>
                    <span th:unless="${keyword != null and !#strings.isEmpty(keyword)}">
                        등록된 일정이 없습니다.
                    </span>
                </div>

                <!-- 일정 목록 -->
                <div class="list-group">
                    <a th:each="item : ${todoList}"
					th:href="@{/todo/{id}( id=${item.todo_id}, page=${pageResponseDTO.pag.page}, keyword=${keyword}, prev_url='/todo/list' )}"
                       class="list-group-item list-group-item-action d-flex align-items-center gap-3">
                        <!-- 상태값(TODO/DOING/DONE)에 따라 아이콘 분기 -->
                        <span th:if="${item.status == 'DONE'}">✅</span>
                        <span th:if="${item.status == 'DOING'}">🔄</span>
                        <span th:if="${item.status == 'TODO'}" class="text-muted">⬜</span>
                        <div class="flex-fill">
                            <span class="badge bg-primary-subtle text-primary-emphasis"
                                  th:text="${#dates.format(item.schedule_date, 'yyyy-MM-dd')}">2026-06-15</span>
                            <div class="fw-medium" th:text="${item.title}">제목</div>
                        </div>
                        <span class="text-muted small">열기 &rarr;</span>
                    </a>
                </div>

                <!-- 페이징 UI -->
                <nav th:if="${pageResponseDTO.totalCount > 0}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${!pageResponseDTO.prev} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/todo/list(page=${pageResponseDTO.startPage - 1}, keyword=${keyword})}">이전</a>
                        </li>

                        <li class="page-item"
                            th:each="pageNum : ${#numbers.sequence(pageResponseDTO.startPage, pageResponseDTO.endPage)}"
                            th:classappend="${pageNum == pageResponseDTO.pag.page} ? 'active'">
                            <a class="page-link"
                               th:href="@{/todo/list(page=${pageNum}, keyword=${keyword})}"
                               th:text="${pageNum}"></a>
                        </li>

                        <li class="page-item" th:classappend="${!pageResponseDTO.next} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/todo/list(page=${pageResponseDTO.endPage + 1}, keyword=${keyword})}">다음</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
