<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 일정 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

    <div class="d-flex" style="height:100vh;">
        <!-- 사이드바 -->
        <aside class="border-end bg-light d-none d-md-flex flex-column" style="width:240px;">
            <div class="p-3 border-bottom fw-semibold small">
                <span class="badge bg-dark me-2">D</span>DayPlanner
            </div>
            <nav class="nav flex-column p-2 small">
                <a th:href="@{/todo/list}" class="nav-link text-dark">🏠 일정 목록</a>
                <a th:href="@{/todo/register}" class="nav-link text-dark">➕ 새 일정 등록</a>
            </nav>
        </aside>

        <div class="flex-fill d-flex flex-column overflow-auto">
            <!-- 헤더 -->
            <header class="border-bottom px-3 py-2 small text-muted d-flex justify-content-between align-items-center">
                <span>DayPlanner / 일정 상세</span>
                <form th:action="@{/user/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">🚪 로그아웃</button>
                </form>
            </header>

            <main class="p-4 p-md-5">
                <div class="mx-auto" style="max-width:720px;">

                    <!-- 상세보기 카드 -->
                    <div class="card border border-light-subtle shadow-sm mb-4">
                        <div class="card-body p-4">
                            
                            <!-- 메인 정보 헤더 -->
                            <div class="border-bottom pb-3 mb-3">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <span class="badge bg-primary-subtle text-primary-emphasis"
                                          th:text="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}">2026-06-15</span>
                                    
                                    <!-- 상태 뱃지 -->
                                    <span th:if="${todo.status == 'DONE'}" class="badge bg-success-subtle text-success-emphasis">✅ 완료</span>
                                    <span th:if="${todo.status == 'DOING'}" class="badge bg-warning-subtle text-warning-emphasis">🔄 진행 중</span>
                                    <span th:if="${todo.status == 'TODO'}" class="badge bg-secondary-subtle text-secondary-emphasis">⬜ 시작 전</span>
                                </div>
                                <h1 class="h3 fw-bold mb-0 text-dark" th:text="${todo.title}">제목</h1>
                            </div>

                            <!-- 본문 내용 -->
                            <div class="py-2 mb-4" style="min-height:120px;">
                                <p class="text-body whitespace-pre-line" th:text="${todo.content}">상세 내용이 여기에 표시됩니다.</p>
                            </div>

                            <!-- 첨부파일 영역 -->
                            <section th:if="${todo.file_url != null}" class="p-3 bg-light rounded border mb-4">
                                <h6 class="fw-bold small mb-2 text-muted">📎 첨부파일</h6>
                                <div class="mb-2" th:if="${#strings.toLowerCase(todo.file_name).endsWith('.jpg') or #strings.toLowerCase(todo.file_name).endsWith('.jpeg') or #strings.toLowerCase(todo.file_name).endsWith('.png') or #strings.toLowerCase(todo.file_name).endsWith('.gif')}">
                                    <img th:src="@{'/files/' + ${todo.file_url}}" class="img-fluid rounded border mb-2 d-block" style="max-height: 400px;">
                                </div>
                                <div>
                                    <a th:href="@{'/files/' + ${todo.file_url}}" th:text="${todo.file_name}" target="_blank" class="btn btn-outline-dark btn-sm text-truncate" style="max-width: 100%;"></a>
                                </div>
                            </section>

                            <!-- 버튼 영역 -->
                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a th:href="@{/todo/list(page=${page},keyword=${keyword})}" class="btn btn-outline-secondary btn-sm">목록</a>
                                <a th:href="@{/todo/modify/{id}(id=${todo.todo_id},page=${page},keyword=${keyword})}" class="btn btn-dark btn-sm">✏️ 수정</a>
                            </div>

                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
