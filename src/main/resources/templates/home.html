<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>DayPlanner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- 공통 레이아웃 CSS -->
    <link th:href="@{/css/common.css}" rel="stylesheet">

    <!-- home 페이지 전용 스타일 -->
    <style>
        .todo-card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 10px;
            background-color: white;
            cursor: pointer;
        }

        .todo-card:hover {
            background-color: #fafafa;
        }

        .todo-date {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- 사이드바 프래그먼트 (현재 메뉴: home) -->
    <div th:replace="~{fragments/layout :: sidebar('home')}"></div>

    <!-- Main -->
    <main class="main">

        <!-- 헤더 프래그먼트 (제목: 홈) -->
        <div th:replace="~{fragments/layout :: header('홈')}"></div>

        <!-- Content -->
        <section class="content">

            <h1 class="page-title">
                오늘도 일정을 정리해보세요.
            </h1>

            <!-- 오늘의 일정 -->
            <div class="mb-5">

                <div class="section-title">
                    오늘의 일정
                </div>

                <div class="todo-card"
                     th:each="todo : ${todayTodos}"
                     th:data-id="${todo.todo_id}">

                    <div th:text="${todo.title}">
                        프로젝트 발표 준비
                    </div>

                    <div class="todo-date"
                         th:text="${todo.schedule_date}">
                        2026-09-23
                    </div>

                </div>

                <div th:if="${#lists.isEmpty(todayTodos)}"
                     class="text-muted">
                    오늘 등록된 일정이 없습니다.
                </div>

            </div>

            <!-- 최근 작업 -->
            <div>

                <div class="section-title">
                    최근 작업
                </div>

                <div class="todo-card"
                     th:each="todo : ${recentTodos}"
                     th:data-id="${todo.todo_id}">

                    <div th:text="${todo.title}">
                        DB 설계
                    </div>

                    <div class="todo-date"
                         th:text="${todo.schedule_date}">
                        2026-09-22
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script>
    $(function () {
        $(".todo-card").on("click", function () {
            const todoId = $(this).data("id");
            location.href = "/todo/view/" + todoId;
        });
    });
</script>

</body>
</html>
