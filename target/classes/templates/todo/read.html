<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 일정 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <main class="mx-auto p-4 p-md-5" style="max-width:560px;">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <h1 class="h4 fw-bold mb-0" th:text="${todo.title}">제목</h1>
            <span th:if="${todo.is_checked == 'Y'}" class="badge bg-success-subtle text-success-emphasis">완료</span>
            <span th:unless="${todo.is_checked == 'Y'}" class="badge bg-secondary-subtle text-secondary-emphasis">미완료</span>
        </div>

        <div class="mb-4">
            <div class="small fw-semibold text-muted mb-1">날짜</div>
            <div th:text="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}">2026-06-15</div>
        </div>
        <div class="mb-4">
            <div class="small fw-semibold text-muted mb-1">상세 내용</div>
            <p th:text="${todo.content}">내용</p>
        </div>

        <div class="d-flex gap-2 pt-2">
            <a th:href="@{/todo/modify/{id}(id=${todo.todo_id})}" class="btn btn-dark btn-sm">수정</a>
            <form id="deleteForm" th:action="@{/todo/delete/{id}(id=${todo.todo_id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
            </form>
            <a th:href="@{/todo/list}" class="btn btn-light btn-sm">목록으로</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 삭제 버튼 누르면 jQuery로 확인창 띄우고, 취소하면 제출 막기
        $('#deleteForm').on('submit', function (e) {
            if (!confirm('삭제하시겠습니까?')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
