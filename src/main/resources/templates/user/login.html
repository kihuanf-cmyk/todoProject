<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <main class="mx-auto p-4 p-md-5" style="max-width:480px;">
        <h1 class="h3 fw-bold mb-4">🔐 로그인</h1>

        <!-- 회원가입 성공 후 넘어온 안내 메시지 -->
        <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

        <!-- Spring Security 로그인 실패 시 자동으로 붙는 ?error 파라미터 감지 -->
        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            아이디 또는 비밀번호가 일치하지 않습니다.
        </div>

        <form id="loginForm" th:action="@{/user/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">아이디</label>
                <input type="text" name="user_id" placeholder="아이디를 입력하세요" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">비밀번호</label>
                <input type="password" name="pwd" placeholder="비밀번호를 입력하세요" class="form-control" required>
            </div>
			<!-- 추가: name은 반드시 remember-me (위 rememberMeParameter와 동일해야 함) -->
			<div class="form-check mb-3">
			    <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
			    <label class="form-check-label" for="rememberMe">로그인 상태 유지</label>
			</div>
            <div class="d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-dark btn-sm">로그인</button>
            </div>
        </form>

        <p class="text-center small text-muted mt-3">
            계정이 없으신가요? <a th:href="@{/user/join}">회원가입하기</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
