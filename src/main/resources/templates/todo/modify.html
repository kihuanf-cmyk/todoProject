<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>

<div class="app-container">

    <!-- 사이드바 프래그먼트 (현재 메뉴: todo) -->
    <div th:replace="~{fragments/layout :: sidebar('todo')}"></div>

    <main class="main">

        <!-- 헤더 프래그먼트 (제목: 일정 수정) -->
        <div th:replace="~{fragments/layout :: header('일정 수정')}"></div>

        <section class="content">
            <div class="mx-auto" style="max-width:720px;">

                <h1 class="page-title">일정 수정</h1>

                <form th:action="@{/todo/update}" method="post" enctype="multipart/form-data">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="todo_id" th:value="${todo.todo_id}">
                    <input type="hidden" name="page" th:value="${page}">
                    <input type="hidden" name="keyword" th:value="${keyword}">
					<input type="hidden" name="prev_url" th:value="${prev_url}">
                    <input type="hidden" name="deleteFile" id="deleteFile" value="false">

                    <div class="mb-3">
                        <label class="form-label">날짜</label>
                        <input type="date" name="schedule_date" th:value="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" name="title" th:value="${todo.title}" class="form-control" required maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">내용</label>
                        <textarea name="content" th:text="${todo.content}" class="form-control" rows="4" maxlength="500" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">상태</label>
                        <select name="status" class="form-select">
                            <option value="TODO" th:selected="${todo.status == 'TODO'}">시작 전</option>
                            <option value="DOING" th:selected="${todo.status == 'DOING'}">진행 중</option>
                            <option value="DONE" th:selected="${todo.status == 'DONE'}">완료</option>
                        </select>
                    </div>

                    <section id="currentFileSection" th:if="${todo.file_url != null}" class="p-3 bg-light rounded border mb-3">
                        <div class="mb-2">
                            <img th:if="${#strings.toLowerCase(todo.file_name).endsWith('.jpg') or #strings.toLowerCase(todo.file_name).endsWith('.jpeg') or #strings.toLowerCase(todo.file_name).endsWith('.png') or #strings.toLowerCase(todo.file_name).endsWith('.gif')}"
                                 th:src="@{'/files/' + ${todo.file_url}}" class="img-fluid rounded border mb-2 d-block" style="max-height:250px;">
                            <a th:href="@{'/files/' + ${todo.file_url}}" th:text="${todo.file_name}" target="_blank"></a>
                        </div>
                        <button type="button" id="deleteFileButton" class="btn btn-outline-danger btn-sm">첨부파일 삭제</button>
                    </section>

                    <div class="mb-3">
                        <label class="form-label">새 첨부파일 (선택 시 기존 파일 교체)</label>
                        <input type="file" name="file" id="fileInput" class="form-control" accept="image/*">
                        <div id="fileName" class="form-text"></div>
                    </div>
                    <div id="newFilePreviewSection" class="p-3 bg-light rounded border mb-3" style="display:none;">
                        <img id="newImagePreview" class="img-fluid rounded border mb-2 d-block" style="max-height:250px;">
                        <button type="button" id="cancelNewFileButton" class="btn btn-outline-secondary btn-sm">새 첨부파일 취소</button>
                    </div>

                    <button type="button" id="deleteTodoButton" class="btn btn-outline-danger btn-sm">일정 삭제</button>
					<a th:href="@{/todo/{id}(id=${todo.todo_id}, page=${page}, keyword=${keyword}, prev_url=${prev_url})}" class="btn btn-outline-secondary btn-sm"> 돌아가기 </a>
                    <button type="submit" class="btn btn-dark btn-sm">저장</button>
                </form>
				<form id="deleteForm" th:action="@{/todo/delete/{id}(id=${todo.todo_id}, prev_url=${prev_url})}" method="post" class="d-none"> </form>

            </div>
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/modify.js}"></script>

</body>
</html>
