<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 오류 발생</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <main class="mx-auto p-4 p-md-5" style="max-width:480px; margin-top: 100px;">

        <!-- 오류 코드 뱃지 -->
        <div class="text-center mb-4">
            <span class="badge bg-danger-subtle text-danger-emphasis fs-6 px-3 py-2"
                  th:text="'오류 ' + ${errorCode}">오류 500</span>
        </div>

        <!-- 오류 제목 & 메시지 -->
        <div class="text-center border-bottom pb-4 mb-4">
            <h1 class="h4 fw-bold mb-3">
                ⚠️ <span th:text="${errorTitle}">문제가 발생했습니다</span>
            </h1>
            <p class="text-muted" th:text="${errorMessage}">
                일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
            </p>
        </div>

        <!-- 이동 버튼 -->
        <div class="d-flex gap-2 justify-content-center">
            <a th:href="@{/todo/list}" class="btn btn-dark btn-sm">📋 일정 목록으로</a>
            <a th:href="@{/user/login}" class="btn btn-light btn-sm">🔐 로그인으로</a>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
