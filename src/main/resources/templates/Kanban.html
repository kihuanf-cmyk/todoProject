<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DayPlanner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link th:href="@{/css/common.css}" rel="stylesheet">
	
	<!-- CSRF 토큰 메타태그 삽입 (AJAX 요청 시 헤더에 실어 보내기 위함) -->
	   <th:block th:replace="~{fragments/layout :: csrfMeta}"></th:block>

    <style>
        .kanban-board {
            display: flex;
            gap: 16px;
        }

        .kanban-column {
            flex: 1;
            background-color: #f7f7f5;
            border-radius: 8px;
            padding: 12px;
            min-height: 400px;
        }

        .kanban-column-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            padding: 0 4px;
            color: #555;
        }

        .kanban-card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            background-color: white;
            padding: 12px;
            margin-bottom: 8px;
            cursor: grab;
        }

        .kanban-card:hover {
            background-color: #fafafa;
        }

        .kanban-card.dragging {
            opacity: 0.4;
        }

        .kanban-card .todo-date {
            font-size: 12px;
            color: #888;
        }

        .kanban-column.drag-over {
            background-color: #eef2ff;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div th:replace="~{fragments/layout :: sidebar('kanban')}"></div>

    <main class="main">

        <div th:replace="~{fragments/layout :: header('칸반 보드')}"></div>

        <section class="content">

            <h1 class="page-title">칸반 보드</h1>

            <div class="kanban-board">

                <!-- 시작 전 -->
                <div class="kanban-column" data-status="TODO">
                    <div class="kanban-column-title">⬜ 시작 전</div>
                    <div class="kanban-card"
                         th:each="todo : ${todoList}"
                         draggable="true"
                         th:data-id="${todo.todo_id}"
						 th:data-status="${todo.status}">
                        <div th:text="${todo.title}">제목</div>
                        <div class="todo-date" th:text="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}">2026-09-23</div>
                    </div>
                </div>

                <!-- 진행 중 -->
                <div class="kanban-column" data-status="DOING">
                    <div class="kanban-column-title">🔄 진행 중</div>
                    <div class="kanban-card"
                         th:each="todo : ${doingList}"
                         draggable="true"
                         th:data-id="${todo.todo_id}"
						 th:data-status="${todo.status}">
                        <div th:text="${todo.title}">제목</div>
                        <div class="todo-date" th:text="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}">2026-09-23</div>
                    </div>
                </div>

                <!-- 완료 -->
                <div class="kanban-column" data-status="DONE">
                    <div class="kanban-column-title">✅ 완료</div>
                    <div class="kanban-card"
                         th:each="todo : ${doneList}"
                         draggable="true"
                         th:data-id="${todo.todo_id}"
						 th:data-status="${todo.status}">
                        <div th:text="${todo.title}">제목</div>
                        <div class="todo-date" th:text="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}">2026-09-23</div>
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/Kanban.js}"></script>

</body>
</html>
