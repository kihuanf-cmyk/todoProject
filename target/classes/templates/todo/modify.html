<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 일정 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <main class="mx-auto p-4 p-md-5" style="max-width:480px;">
        <h1 class="h3 fw-bold mb-4">✏️ 일정 수정</h1>

        <form th:action="@{/todo/update}" method="post">
            <input type="hidden" name="todo_id" th:value="${todo.todo_id}">

            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">날짜</label>
                <input type="date" name="schedule_date" th:value="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">제목</label>
                <input type="text" name="title" th:value="${todo.title}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">내용</label>
                <textarea name="content" rows="3" class="form-control" th:text="${todo.content}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">완료 여부</label>
                <select name="is_checked" class="form-select">
                    <option value="N" th:selected="${todo.is_checked == 'N'}">미완료</option>
                    <option value="Y" th:selected="${todo.is_checked == 'Y'}">완료</option>
                </select>
            </div>
            <div class="d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-dark btn-sm">변경사항 저장</button>
                <a th:href="@{/todo/{id}(id=${todo.todo_id})}" class="btn btn-light btn-sm">돌아가기</a>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
