<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayPlanner - 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <main class="mx-auto p-4 p-md-5" style="max-width:480px;">
        <h1 class="h3 fw-bold mb-4">📝 회원가입</h1>

        <!-- 가입 실패 시 에러 메시지 (아이디 중복 등) -->
        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

        <form id="joinForm" th:action="@{/user/join}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">아이디</label>
                <input type="text" name="user_id" placeholder="아이디를 입력하세요" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">비밀번호</label>
                <input type="password" name="pwd" placeholder="비밀번호를 입력하세요" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">이름</label>
                <input type="text" name="user_name" placeholder="이름을 입력하세요" class="form-control" required>
            </div>
            <div class="d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-dark btn-sm">가입 완료</button>
                <a th:href="@{/user/login}" class="btn btn-light btn-sm">취소</a>
            </div>
        </form>

        <p class="text-center small text-muted mt-3">
            이미 계정이 있으신가요? <a th:href="@{/user/login}">로그인하기</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 필수 입력값 비어있으면 제출 전 포커스만 잡아주는 간단한 jQuery 보조 검증
        $('#joinForm').on('submit', function (e) {
            var userId = $('input[name="user_id"]').val().trim();
            if (!userId) {
                e.preventDefault();
                $('input[name="user_id"]').focus();
            }
        });
    </script>
</body>
</html>
