<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DayPlanner - 일정 수정</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
	<main class="mx-auto p-4 p-md-5" style="max-width:480px;">
		
		<h1 class="h3 fw-bold mb-4">✏️ 일정 수정</h1>
		<!-- ======================================== -->
		<!-- 일정 수정 form                            -->
		<!-- ======================================== -->
		<form th:action="@{/todo/update}" method="post" enctype="multipart/form-data">
			
			<!-- 일정 정보 -->
			<input type="hidden" name="todo_id" th:value="${todo.todo_id}">
			<input type="hidden" name="page" th:value="${page}">
			<input type="hidden" name="keyword" th:value="${keyword}">
			
			<!-- 날짜 -->
			<div class="mb-3">
				<label class="form-label small fw-semibold text-muted"> 날짜 </label>
				<input type="date" name="schedule_date" th:value="${#dates.format(todo.schedule_date, 'yyyy-MM-dd')}"
					class="form-control" required>
			</div>
			
			<!-- 제목 -->
			<div class="mb-3">
				<label class="form-label small fw-semibold text-muted"> 제목 </label>
				<input type="text" name="title" th:value="${todo.title}" class="form-control" required>
			</div>
			
			<!-- 내용 -->
			<div class="mb-3">
				<label class="form-label small fw-semibold text-muted"> 내용 </label>
				<textarea name="content" rows="3" class="form-control" th:text="${todo.content}"></textarea>
			</div>
			
			<!-- 진행 상태 -->
			<div class="mb-3">
				<label class="form-label small fw-semibold text-muted"> 진행 상태 </label>
				<select name="status" class="form-select">
					<option value="TODO" th:selected="${todo.status == 'TODO'}"> 시작전 </option>
					<option value="DOING" th:selected="${todo.status == 'DOING'}"> 진행중 </option>
					<option value="DONE" th:selected="${todo.status == 'DONE'}"> 완료 </option>
				</select>
			</div>

			<!-- ======================================== -->
			<!-- 새 첨부파일 추가                          -->
			<!-- ======================================== -->
			<div class="mb-3">
				<label class="form-label small fw-semibold text-muted"> 첨부파일 추가 </label>
				<input type="file" name="files" class="form-control" multiple>
			</div>
			<!-- 저장 / 돌아가기 -->
			<div class="d-flex gap-2 pt-2">
				<button type="submit" class="btn btn-dark btn-sm"> 변경사항 저장 </button>
				<a th:href="@{/todo/{id}(id=${todo.todo_id}, page=${page}, keyword=${keyword})}" class="btn btn-light btn-sm"> 돌아가기 </a>
			</div>
		</form>

		<!-- ======================================== -->
		<!-- 기존 첨부파일                              -->
		<!-- ======================================== -->
		<div class="mb-3 mt-4" th:if="${todo.files != null and !todo.files.isEmpty()}">
			<label class="form-label small fw-semibold text-muted"> 기존 첨부파일 </label>
			<!-- file은 th:each 안에서만 사용할 수 있음 -->
			<div th:each="file : ${todo.files}" class="mb-2 d-flex align-items-start gap-2">
				<!-- 파일 정보 -->
				<div class="flex-grow-1">
					
					<!-- ======================================== -->
					<!-- 이미지 파일                                -->
					<!-- ======================================== -->
					<div th:if="${#strings.toLowerCase(file.file_name).endsWith('.jpg')
                         or #strings.toLowerCase(file.file_name).endsWith('.jpeg')
                         or #strings.toLowerCase(file.file_name).endsWith('.png')
                         or #strings.toLowerCase(file.file_name).endsWith('.gif')}">
						<img th:src="@{'/files/' + ${file.file_url}}" style="max-width:100%; border-radius:6px;">
						<div class="small text-muted mt-1" th:text="${file.file_name}">
					</div>

					</div>

					<!-- ======================================== -->
					<!-- 일반 파일                                  -->
					<!-- ======================================== -->

					<div th:unless="${#strings.toLowerCase(file.file_name).endsWith('.jpg')
                              or #strings.toLowerCase(file.file_name).endsWith('.jpeg')
                              or #strings.toLowerCase(file.file_name).endsWith('.png')
                              or #strings.toLowerCase(file.file_name).endsWith('.gif')}">
						📄 <a th:href="@{'/files/' + ${file.file_url}}" th:text="${file.file_name}" target="_blank"> </a>

					</div>

				</div>


				<!-- ======================================== -->
				<!-- 파일 개별 삭제 form                        -->
				<!-- ======================================== -->

				<!-- 중요: 이 form은 '일정 수정 form' 밖에 있음. 그리고 th:each 안에 있기 때문에 ${file.file_id}를 사용할 수 있음.-->
				<form th:action="@{/todo/file/delete/{fileId}(fileId=${file.file_id})}" method="post" class="file-delete-form">
					<input type="hidden" name="todo_id" th:value="${todo.todo_id}">
					<input type="hidden" name="page" th:value="${page}">
					<input type="hidden" name="keyword" th:value="${keyword}">
					<button type="submit" class="btn btn-sm btn-outline-danger"> 삭제 </button>
				</form>

			</div>

		</div>
		

	</main>

	<!-- ======================================== -->
	<!-- JavaScript / Bootstrap                    -->
	<!-- ======================================== -->
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// 파일 업로드 용량 검사
		$('form').on('submit', function (e) { 
			var maxSize = 10 * 1024 * 1024; // 10MB
			var fileInput = $('input[name="files"]')[0];
			// 파일 선택창이 없는 경우 방어
			if (!fileInput) { return;
			}
			var files = fileInput.files;
			for (var i = 0; i < files.length; i++) {
				if (files[i].size > maxSize) {
					e.preventDefault();
					alert( '업로드를 할 수 없습니다. (' + files[i].name + '은 10MB를 초과합니다)' );
					return;
				}
			}

		});

		// 기존 파일 삭제 전 확인
		$('.file-delete-form').on('submit', function (e) {
			if (!confirm('이 파일을 삭제하시겠습니까?')) {
				e.preventDefault();
			}

		});

	</script>

</body>

</html>
